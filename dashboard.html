<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher Dashboard | LEARNER QUEST</title>
<style>
:root{--a:#7c2d12;--b:#ea580c;--c:#f59e0b;--bg:#fff7ed;--ink:#2b2118;--line:#fed7aa}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Noto Sans Thai",sans-serif;background:linear-gradient(135deg,#fff7ed,#fef3c7);color:var(--ink)}
.wrap{max-width:1400px;margin:auto;padding:18px}
.hero{background:linear-gradient(135deg,var(--a),var(--b),var(--c));color:#fff;border-radius:26px;padding:25px;box-shadow:0 12px 30px #7c2d1230}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:16px 0}
.card,.panel{background:#fff;border-radius:20px;padding:18px;box-shadow:0 8px 24px #7c2d1218}
.num{font-size:32px;font-weight:900;color:#c2410c}
.muted{color:#73543e}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr auto auto;gap:10px}
input,select,button{padding:11px 13px;border-radius:12px;border:2px solid var(--line);font-size:15px}
button{border:0;background:#c2410c;color:#fff;font-weight:800;cursor:pointer}
.soft{background:#ffedd5;color:#9a3412}
.tableWrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:1150px}
th,td{padding:10px;border-bottom:1px solid #ffedd5;text-align:left;vertical-align:top}
th{background:#fff7ed;position:sticky;top:0;z-index:1}
.badge{display:inline-block;padding:4px 9px;border-radius:99px;background:#fef3c7;color:#92400e;font-weight:800}
.ok{color:#15803d;font-weight:800}
.no{color:#b91c1c}
.questbox{min-width:150px}
.answer{font-size:13px;line-height:1.45;margin-top:5px}
.err{color:#b91c1c;font-weight:800}
.loading{color:#9a3412;font-weight:800}
.small{font-size:13px}
@media(max-width:760px){.filters{grid-template-columns:1fr}.hero h1{font-size:28px}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
  <div class="row">
    <div><h1>📊 Teacher Dashboard</h1><div>LEARNER QUEST • ติดตามภารกิจนักเรียนรู้</div></div>
    <div>
      <button class="soft" onclick="loadData()">🔄 รีเฟรชข้อมูล</button>
      <button class="soft" onclick="location.href='index.html'">🎮 หน้าเกม</button>
    </div>
  </div>
</section>

<div class="cards">
  <div class="card"><div class="muted">👥 ผู้เรียน</div><div id="students" class="num">0</div></div>
  <div class="card"><div class="muted">📝 ภารกิจที่ส่ง</div><div id="answers" class="num">0</div></div>
  <div class="card"><div class="muted">🏆 MASTER LEARNER</div><div id="masters" class="num">0</div></div>
  <div class="card"><div class="muted">⭐ XP รวม</div><div id="totalXp" class="num">0</div></div>
</div>

<section class="panel">
  <div class="filters">
    <input id="search" placeholder="🔎 ค้นหาชื่อ / สกร.ระดับตำบล" oninput="render()">
    <select id="level" onchange="render()">
      <option value="">ทุกระดับ</option>
      <option>ประถมศึกษา</option>
      <option>มัธยมศึกษาตอนต้น</option>
      <option>มัธยมศึกษาตอนปลาย</option>
    </select>
    <select id="tambon" onchange="render()"><option value="">ทุก สกร.ระดับตำบล</option></select>
    <button onclick="exportCSV()">📥 Export CSV</button>
    <button class="soft" onclick="loadData()">🔄 โหลดอีกครั้ง</button>
  </div>
  <p id="status" class="loading">กำลังโหลดข้อมูล...</p>

  <div class="tableWrap">
    <table>
      <thead>
        <tr>
          <th>ผู้เรียน</th><th>สกร.ระดับตำบล</th><th>ระดับ</th>
          <th>XP</th><th>ความก้าวหน้า</th>
          <th>🌱 ภารกิจ 01</th><th>🔍 ภารกิจ 02</th><th>💡 ภารกิจ 03</th>
          <th>🎤 ภารกิจ 04</th><th>🚀 ภารกิจ 05</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</section>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyVaulBJqyuBEiPfAB62eypHKyR271JhZ1YJKImo9yqFLqlQkk99bxNRE_pLCuWGa-UDA/exec";
const QUEST_NAMES = [
  "ภารกิจ 01 • นักเริ่มต้น",
  "ภารกิจ 02 • นักค้นพบ",
  "ภารกิจ 03 • นักคิด",
  "ภารกิจ 04 • นักเล่า",
  "ภารกิจ 05 • นักนำไปใช้"
];
let raw = [], students = [];

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

function normalizeQuest(q) {
  const s = String(q || "").trim().toLowerCase();
  for(let i=0;i<QUEST_NAMES.length;i++) {
    if(s.includes("01") || s.includes("เริ่มต้น")) return 0;
    if(s.includes("02") || s.includes("ค้นพบ")) return 1;
    if(s.includes("03") || s.includes("นักคิด")) return 2;
    if(s.includes("04") || s.includes("นักเล่า")) return 3;
    if(s.includes("05") || s.includes("นำไปใช้")) return 4;
  }
  return -1;
}

function loadData() {
  const st=document.getElementById("status");
  st.className="loading";
  st.textContent="กำลังโหลดข้อมูลจาก Google Sheets...";
  fetch(API_URL+"?action=list&t="+Date.now(),{cache:"no-store"})
    .then(r=>{if(!r.ok) throw new Error("HTTP "+r.status); return r.json();})
    .then(j=>{
      if(j && j.ok===false) throw new Error(j.error||j.message||"API error");
      raw=Array.isArray(j)?j:(j.data||j.rows||[]);
      buildStudents();
      st.className="muted";
      st.textContent="✅ โหลดข้อมูลสำเร็จ "+raw.length+" รายการ • "+new Date().toLocaleString("th-TH");
    })
    .catch(e=>{
      console.error(e);
      raw=[]; buildStudents();
      st.className="err";
      st.innerHTML="❌ โหลดข้อมูลไม่ได้: "+esc(e.message)+"<br><span class='small'>ตรวจสอบว่า Apps Script ได้ Deploy เวอร์ชันใหม่แล้ว และใช้ URL /exec เดิม</span>";
    });
}

function val(x, keys) {
  for(const k of keys) if(x && x[k] != null && String(x[k]).trim()!=="") return x[k];
  return "";
}

function buildStudents() {
  const m=new Map();
  raw.forEach((x,i)=>{
    const name=val(x,["name","Name","ชื่อผู้เรียน","ชื่อ"]);
    const tambon=val(x,["tambon","Tambon","district","District","สกร.ระดับตำบล","ตำบล"]);
    const level=val(x,["level","Level","ระดับ","ระดับการศึกษา"]);
    const quest=val(x,["quest","Quest","ภารกิจ"]);
    const answer=val(x,["answer","Answer","คำตอบ"]);
    const xp=Number(val(x,["xp","XP","Xp","คะแนน XP","คะแนน"])||0);
    if(!name) return;
    const key=name+"|"+tambon+"|"+level;
    if(!m.has(key)) m.set(key,{name,tambon,level,xp:0,count:0,quests:[null,null,null,null,null]});
    const s=m.get(key);
    const qi=normalizeQuest(quest);
    s.xp+=xp; s.count++;
    if(qi>=0) s.quests[qi]={quest,answer,xp};
  });
  students=[...m.values()];
  document.getElementById("students").textContent=students.length;
  document.getElementById("answers").textContent=raw.length;
  document.getElementById("masters").textContent=students.filter(x=>x.xp>=100).length;
  document.getElementById("totalXp").textContent=students.reduce((a,b)=>a+b.xp,0);

  const sel=document.getElementById("tambon"),cur=sel.value;
  const vals=[...new Set(students.map(x=>x.tambon).filter(Boolean))].sort();
  sel.innerHTML='<option value="">ทุก สกร.ระดับตำบล</option>'+vals.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");
  sel.value=cur;
  render();
}

function filtered() {
  const q=document.getElementById("search").value.trim().toLowerCase();
  const l=document.getElementById("level").value;
  const t=document.getElementById("tambon").value;
  return students.filter(x=>
    (!q || (x.name+" "+x.tambon).toLowerCase().includes(q)) &&
    (!l || x.level===l) && (!t || x.tambon===t)
  ).sort((a,b)=>b.xp-a.xp);
}

function cell(q) {
  if(!q) return '<span class="no">— ยังไม่ทำ</span>';
  return '<span class="ok">✅ ทำแล้ว +'+esc(q.xp)+' XP</span><div class="answer">'+esc(q.answer)+'</div>';
}

function render() {
  const a=filtered();
  document.getElementById("tbody").innerHTML=a.length ? a.map(x=>`
    <tr>
      <td><b>${esc(x.name)}</b></td>
      <td>${esc(x.tambon)}</td>
      <td>${esc(x.level)}</td>
      <td><span class="badge">${x.xp} XP</span></td>
      <td>${x.count}/5 ${x.xp>=100?'<span class="ok">🏆 MASTER</span>':''}</td>
      <td class="questbox">${cell(x.quests[0])}</td>
      <td class="questbox">${cell(x.quests[1])}</td>
      <td class="questbox">${cell(x.quests[2])}</td>
      <td class="questbox">${cell(x.quests[3])}</td>
      <td class="questbox">${cell(x.quests[4])}</td>
    </tr>`).join("") :
    '<tr><td colspan="10" class="muted">ยังไม่มีข้อมูลที่ตรงกับเงื่อนไข</td></tr>';
}

function exportCSV() {
  const a=filtered();
  const rows=[["ชื่อผู้เรียน","สกร.ระดับตำบล","ระดับ","XP","จำนวนภารกิจ","ภารกิจ01","คำตอบ01","ภารกิจ02","คำตอบ02","ภารกิจ03","คำตอบ03","ภารกิจ04","คำตอบ04","ภารกิจ05","คำตอบ05"]];
  a.forEach(x=>{
    const r=[x.name,x.tambon,x.level,x.xp,x.count];
    x.quests.forEach(q=>r.push(q?q.quest:"",q?q.answer:""));
    rows.push(r);
  });
  const csv="\ufeff"+rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const u=URL.createObjectURL(blob),aEl=document.createElement("a");
  aEl.href=u;aEl.download="learner-quest-dashboard.csv";aEl.click();URL.revokeObjectURL(u);
}

loadData();
</script>
</body>
</html>
