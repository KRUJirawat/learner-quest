<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Dashboard | LEARNER QUEST</title><style>
:root{--a:#7c2d12;--b:#ea580c;--c:#f59e0b;--bg:#fff7ed;--ink:#2b2118}*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Thai",sans-serif;background:linear-gradient(135deg,#fff7ed,#fef3c7);color:var(--ink)}.wrap{max-width:1250px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,var(--a),var(--b),var(--c));color:#fff;border-radius:26px;padding:25px;box-shadow:0 12px 30px #7c2d1230}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:16px 0}.card,.panel{background:#fff;border-radius:20px;padding:18px;box-shadow:0 8px 24px #7c2d1218}.num{font-size:32px;font-weight:900;color:#c2410c}.muted{color:#73543e}.filters{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px}input,select,button{padding:11px 13px;border-radius:12px;border:2px solid #fed7aa;font-size:15px}button{border:0;background:#c2410c;color:#fff;font-weight:800;cursor:pointer}.soft{background:#ffedd5;color:#9a3412}.tableWrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:11px;border-bottom:1px solid #ffedd5;text-align:left;vertical-align:top}th{background:#fff7ed;position:sticky;top:0}.badge{display:inline-block;padding:4px 9px;border-radius:99px;background:#fef3c7;color:#92400e;font-weight:800}.ok{color:#15803d}.err{color:#b91c1c}.hidden{display:none}@media(max-width:760px){.filters{grid-template-columns:1fr}.hero h1{font-size:28px}}
</style></head><body><div class="wrap"><section class="hero"><div class="row"><div><h1>📊 Teacher Dashboard</h1><div>LEARNER QUEST • ระบบติดตามภารกิจนักเรียนรู้</div></div><div><button class="soft" onclick="loadData()">🔄 รีเฟรชข้อมูล</button> <button class="soft" onclick="location.href='index.html'">🎮 หน้าเกม</button></div></div></section>
<div class="cards"><div class="card"><div class="muted">👥 ผู้เรียน</div><div id="students" class="num">0</div></div><div class="card"><div class="muted">📝 คำตอบทั้งหมด</div><div id="answers" class="num">0</div></div><div class="card"><div class="muted">🏆 MASTER LEARNER</div><div id="masters" class="num">0</div></div><div class="card"><div class="muted">⭐ XP รวม</div><div id="totalXp" class="num">0</div></div></div>
<section class="panel"><div class="filters"><input id="search" placeholder="🔎 ค้นหาชื่อ / สกร.ระดับตำบล" oninput="render()"><select id="level" onchange="render()"><option value="">ทุกระดับ</option><option>ประถมศึกษา</option><option>มัธยมศึกษาตอนต้น</option><option>มัธยมศึกษาตอนปลาย</option></select><select id="tambon" onchange="render()"><option value="">ทุก สกร.ระดับตำบล</option></select><button onclick="exportCSV()">📥 Export CSV</button></div><p id="status" class="muted">กำลังโหลดข้อมูล...</p><div class="tableWrap"><table><thead><tr><th>ชื่อผู้เรียน</th><th>สกร.ระดับตำบล</th><th>ระดับ</th><th>XP</th><th>ความก้าวหน้า</th><th>ภารกิจล่าสุด</th><th>คำตอบล่าสุด</th></tr></thead><tbody id="tbody"></tbody></table></div></section></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbyVaulBJqyuBEiPfAB62eypHKyR271JhZ1YJKImo9yqFLqlQkk99bxNRE_pLCuWGa-UDA/exec';let raw=[],students=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function loadData(){const st=document.getElementById('status');st.textContent='กำลังโหลดข้อมูล...';try{const r=await fetch(API_URL+'?action=list&t='+Date.now());if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();raw=Array.isArray(j)?j:(j.data||j.rows||[]);normalize();st.textContent='อัปเดตล่าสุด '+new Date().toLocaleString('th-TH');}catch(e){console.error(e);st.innerHTML='<span class="err">โหลดข้อมูลไม่ได้ — ต้องเพิ่ม action=list ใน Google Apps Script ตามไฟล์ Code.gs ที่ให้มาด้วย</span>';raw=[];normalize();}}
function normalize(){const m=new Map();raw.forEach((x,i)=>{const name=x.name||x.Name||x['ชื่อผู้เรียน']||'';const tambon=x.tambon||x.Tambon||x['สกร.ระดับตำบล']||'';const level=x.level||x.Level||x['ระดับ']||'';const quest=x.quest||x.Quest||x['ภารกิจ']||'';const answer=x.answer||x.Answer||x['คำตอบ']||'';const xp=Number(x.xp||x.XP||0);if(!name)return;const k=name+'|'+tambon+'|'+level;if(!m.has(k))m.set(k,{name,tambon,level,xp:0,count:0,lastQuest:'',lastAnswer:'',_i:0});const s=m.get(k);s.xp+=xp;s.count++;if(i>=s._i){s.lastQuest=quest;s.lastAnswer=answer;s._i=i}});students=[...m.values()];document.getElementById('students').textContent=students.length;document.getElementById('answers').textContent=raw.length;document.getElementById('masters').textContent=students.filter(x=>x.xp>=100).length;document.getElementById('totalXp').textContent=students.reduce((a,b)=>a+b.xp,0);const sel=document.getElementById('tambon'),cur=sel.value,vals=[...new Set(students.map(x=>x.tambon).filter(Boolean))].sort();sel.innerHTML='<option value="">ทุก สกร.ระดับตำบล</option>'+vals.map(v=>`<option>${esc(v)}</option>`).join('');sel.value=cur;render();}
function filtered(){const q=document.getElementById('search').value.trim().toLowerCase(),l=document.getElementById('level').value,t=document.getElementById('tambon').value;return students.filter(x=>(!q||(x.name+' '+x.tambon).toLowerCase().includes(q))&&(!l||x.level===l)&&(!t||x.tambon===t)).sort((a,b)=>b.xp-a.xp)}
function render(){const a=filtered();document.getElementById('tbody').innerHTML=a.length?a.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.tambon)}</td><td>${esc(x.level)}</td><td><span class="badge">${x.xp} XP</span></td><td>${Math.min(x.count,5)}/5 ${x.xp>=100?'<span class="ok">🏆 MASTER</span>':''}</td><td>${esc(x.lastQuest)}</td><td>${esc(x.lastAnswer)}</td></tr>`).join(''):'<tr><td colspan="7" class="muted">ยังไม่มีข้อมูล</td></tr>'}
function exportCSV(){const a=filtered(),rows=[['ชื่อผู้เรียน','สกร.ระดับตำบล','ระดับ','XP','จำนวนภารกิจ','ภารกิจล่าสุด','คำตอบล่าสุด'],...a.map(x=>[x.name,x.tambon,x.level,x.xp,x.count,x.lastQuest,x.lastAnswer])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(blob),aEl=document.createElement('a');aEl.href=u;aEl.download='learner-quest-dashboard.csv';aEl.click();URL.revokeObjectURL(u)}
loadData();
</script></body></html>
